<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>JioTV+ | Live Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}

body{
  background:#000;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

/* Top Bar */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  background:#0a0a0a;
  border-bottom:1px solid #222;
  gap:10px;
  flex-wrap:wrap;
}

.back-btn{
  background:rgba(255,255,255,.1);
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:.85rem;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
  transition:.2s;
}

.back-btn:hover{
  background:#e53e3e;
}

.channel-info{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}

.channel-logo{
  width:35px;
  height:35px;
  border-radius:8px;
  object-fit:contain;
  background:rgba(255,255,255,.05);
  flex-shrink:0;
}

.channel-details{
  min-width:0;
}

.channel-name{
  font-size:.9rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-group{
  font-size:.7rem;
  opacity:.5;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:6px;
  background:#ef4444;
  padding:6px 14px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
  flex-shrink:0;
}

.live-dot{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  animation:pulse 1.2s infinite alternate;
}

@keyframes pulse{
  0%{opacity:.4;transform:scale(.7)}
  100%{opacity:1;transform:scale(1.1)}
}

/* Player Container */
.player-wrapper{
  position:relative;
  width:100%;
  height:calc(100vh - 60px);
  background:#000;
}

#playerContainer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

/* Loading */
.loading-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  z-index:50;
}

.loading-overlay.hidden{
  display:none;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid rgba(229,62,62,.2);
  border-top:4px solid #e53e3e;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* Error */
.error-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  z-index:60;
  text-align:center;
  padding:20px;
}

.error-overlay.hidden{
  display:none;
}

.error-icon{
  font-size:3rem;
  color:#ef4444;
}

.error-msg{
  font-size:.9rem;
  opacity:.8;
  max-width:350px;
  line-height:1.5;
}

.btns{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:10px;
}

.btn{
  padding:10px 20px;
  border-radius:25px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:.85rem;
  border:none;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
  transition:.2s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn-red{
  background:#ef4444;
}

.btn-blue{
  background:#3b82f6;
}

.btn-gray{
  background:#444;
}

@media(max-width:768px){
  .top-bar{
    padding:8px 10px;
  }
  .player-wrapper{
    height:calc(100vh - 90px);
  }
  .channel-name{
    font-size:.8rem;
  }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <a href="index.html" class="back-btn">
    <i class="fas fa-arrow-left"></i> Channels
  </a>
  
  <div class="channel-info">
    <img class="channel-logo" id="chLogo" src="" alt="" onerror="this.style.display='none'">
    <div class="channel-details">
      <div class="channel-name" id="chName">Loading...</div>
      <div class="channel-group" id="chGroup"></div>
    </div>
  </div>
  
  <div class="live-badge">
    <span class="live-dot"></span> LIVE
  </div>
</div>

<!-- Player -->
<div class="player-wrapper">
  <div id="playerContainer"></div>
  
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span>Loading stream...</span>
  </div>
  
  <div class="error-overlay hidden" id="errorOverlay">
    <div class="error-icon"><i class="fas fa-exclamation-circle"></i></div>
    <div class="error-msg" id="errorMsg">Stream error occurred.</div>
    <div class="btns">
      <button class="btn btn-red" id="retryBtn">
        <i class="fas fa-redo-alt"></i> Retry
      </button>
      <button class="btn btn-blue" id="newTabBtn">
        <i class="fas fa-external-link-alt"></i> Open in Browser
      </button>
      <a href="index.html" class="btn btn-gray">
        <i class="fas fa-th-list"></i> More Channels
      </a>
    </div>
  </div>
</div>

<script>
// Get URL parameters
const params = new URLSearchParams(window.location.search);
const chName = params.get('name') || 'Live Stream';
const chUrl = params.get('url') || '';
const chLogo = params.get('logo') || '';
const chGroup = params.get('group') || '';

// DOM Elements
const chNameEl = document.getElementById('chName');
const chGroupEl = document.getElementById('chGroup');
const chLogoEl = document.getElementById('chLogo');
const loadingOverlay = document.getElementById('loadingOverlay');
const errorOverlay = document.getElementById('errorOverlay');
const errorMsg = document.getElementById('errorMsg');
const retryBtn = document.getElementById('retryBtn');
const newTabBtn = document.getElementById('newTabBtn');

// Set channel info
chNameEl.textContent = chName;
chGroupEl.textContent = chGroup;
if (chLogo) chLogoEl.src = chLogo;
newTabBtn.onclick = () => window.open(chUrl, '_blank');
retryBtn.onclick = initPlayer;

// Main initialization
function initPlayer() {
  loadingOverlay.classList.remove('hidden');
  errorOverlay.classList.add('hidden');
  
  if (!chUrl) {
    showError('No stream URL found. Please go back and select a channel.');
    return;
  }
  
  console.log('Starting player with URL:', chUrl);
  
  // Clear previous player
  const container = document.getElementById('playerContainer');
  container.innerHTML = '';
  
  // Check URL type
  const isHLS = chUrl.includes('.m3u8');
  const isDASH = chUrl.includes('.mpd');
  const isMP4 = chUrl.includes('.mp4');
  
  // Try JW Player first
  try {
    setupJWPlayer(chUrl, isHLS, isDASH, isMP4);
  } catch(e) {
    console.error('JW Player setup failed:', e);
    // Fallback to iframe
    setupFallbackPlayer(chUrl);
  }
}

// JW Player Setup
function setupJWPlayer(url, isHLS, isDASH, isMP4) {
  const container = document.getElementById('playerContainer');
  
  // Create video element for JW Player
  const videoDiv = document.createElement('div');
  videoDiv.id = 'jwplayerDiv';
  container.appendChild(videoDiv);
  
  const player = jwplayer('jwplayerDiv');
  
  // Configure based on stream type
  const config = {
    file: url,
    width: '100%',
    height: '100%',
    autostart: true,
    mute: false,
    controls: true,
    displaytitle: false,
    stretching: 'uniform',
    
    // HLS specific
    ...(isHLS && {
      type: 'hls',
      hlsjsConfig: {
        enableWorker: true,
        lowLatencyMode: true
      }
    }),
    
    // DASH specific
    ...(isDASH && {
      type: 'dash'
    }),
    
    // MP4 specific
    ...(isMP4 && {
      type: 'mp4'
    }),
    
    // Skin
    skin: {
      name: 'glow',
      active: '#e53e3e',
      inactive: '#ffffff',
      background: '#000000'
    },
    
    // Logo
    logo: {
      file: chLogo || '',
      link: 'index.html',
      position: 'top-right'
    }
  };
  
  player.setup(config);
  
  // Events
  player.on('ready', function() {
    console.log('JW Player ready');
    loadingOverlay.classList.add('hidden');
  });
  
  player.on('play', function() {
    console.log('Stream playing');
    loadingOverlay.classList.add('hidden');
    errorOverlay.classList.add('hidden');
  });
  
  player.on('buffer', function() {
    loadingOverlay.classList.remove('hidden');
  });
  
  player.on('bufferChange', function(e) {
    if (e.bufferPercent > 10) {
      loadingOverlay.classList.add('hidden');
    }
  });
  
  player.on('error', function(e) {
    console.error('JW Player Error:', e);
    
    // Try fallback on error
    player.remove();
    setupFallbackPlayer(url);
  });
  
  player.on('setupError', function(e) {
    console.error('JW Setup Error:', e);
    player.remove();
    setupFallbackPlayer(url);
  });
}

// Fallback Player using iframe or video tag
function setupFallbackPlayer(url) {
  console.log('Using fallback player for:', url);
  
  const container = document.getElementById('playerContainer');
  container.innerHTML = '';
  
  const isHLS = url.includes('.m3u8');
  
  if (isHLS) {
    // Try HLS.js with video tag
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      setupHLSPLayer(url, container);
    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
      // Native HLS (Safari)
      setupNativePlayer(url, container);
    } else {
      // Iframe fallback
      setupIframePlayer(url, container);
    }
  } else {
    // Direct video for MP4
    setupNativePlayer(url, container);
  }
}

// HLS.js Player
function setupHLSPLayer(url, container) {
  const video = document.createElement('video');
  video.id = 'videoPlayer';
  video.controls = true;
  video.autoplay = true;
  video.style.width = '100%';
  video.style.height = '100%';
  container.appendChild(video);
  
  const hls = new Hls({
    enableWorker: true,
    lowLatencyMode: true,
    backBufferLength: 90
  });
  
  hls.loadSource(url);
  hls.attachMedia(video);
  
  hls.on(Hls.Events.MANIFEST_PARSED, function() {
    video.play().catch(() => {});
    loadingOverlay.classList.add('hidden');
  });
  
  hls.on(Hls.Events.ERROR, function(event, data) {
    if (data.fatal) {
      console.error('HLS Error:', data);
      switch(data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          hls.startLoad();
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          hls.recoverMediaError();
          break;
        default:
          hls.destroy();
          showError('Stream format not supported. Try opening in browser.');
          break;
      }
    }
  });
}

// Native Player (for MP4 or Safari HLS)
function setupNativePlayer(url, container) {
  const video = document.createElement('video');
  video.src = url;
  video.controls = true;
  video.autoplay = true;
  video.style.width = '100%';
  video.style.height = '100%';
  container.appendChild(video);
  
  video.addEventListener('canplay', function() {
    loadingOverlay.classList.add('hidden');
    video.play().catch(() => {});
  });
  
  video.addEventListener('error', function() {
    setupIframePlayer(url, container);
  });
}

// Iframe Player (last resort)
function setupIframePlayer(url, container) {
  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  iframe.allow = 'autoplay; fullscreen';
  iframe.allowFullscreen = true;
  container.appendChild(iframe);
  
  iframe.addEventListener('load', function() {
    loadingOverlay.classList.add('hidden');
  });
  
  iframe.addEventListener('error', function() {
    showError('Could not load stream. Try opening in browser.');
  });
}

// Show error
function showError(msg) {
  loadingOverlay.classList.add('hidden');
  errorMsg.textContent = msg;
  errorOverlay.classList.remove('hidden');
}

// Initialize player on load
if (chUrl) {
  initPlayer();
  
  // Timeout for loading
  setTimeout(function() {
    if (!loadingOverlay.classList.contains('hidden')) {
      loadingOverlay.classList.add('hidden');
    }
  }, 15000);
} else {
  showError('No stream URL provided.');
}

// Keyboard controls
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    window.location.href = 'index.html';
  }
});
</script>
</body>
  </html>
