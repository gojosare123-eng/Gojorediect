<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="JioTV+ Live Stream">
<meta property="og:description" content="Watch Live TV in HD Quality">
<title>JioTV+ | Live Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- JW Player -->
<script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',system-ui,sans-serif;
}

body{
  background:#000;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

/* ===== TOP BAR ===== */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  background:#0a0a0a;
  border-bottom:1px solid #1e1e1e;
  z-index:100;
  gap:10px;
  flex-wrap:wrap;
}

.back-btn{
  background:rgba(255,255,255,.08);
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  font-size:.84rem;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  transition:all .2s;
  white-space:nowrap;
}

.back-btn:hover{
  background:#e53e3e;
  color:#fff;
}

.channel-info{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
  min-width:0;
}

.channel-logo{
  width:38px;
  height:38px;
  border-radius:10px;
  object-fit:contain;
  background:rgba(255,255,255,.05);
  flex-shrink:0;
}

.channel-details{
  min-width:0;
}

.channel-name{
  font-size:.92rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-group{
  font-size:.7rem;
  opacity:.55;
  margin-top:1px;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:6px;
  background:#ef4444;
  padding:6px 14px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
  flex-shrink:0;
  animation:livePulse 2s infinite;
}

@keyframes livePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}
  50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}
}

.live-dot{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  animation:pulse 1.2s infinite alternate;
}

@keyframes pulse{
  0%{opacity:.4;transform:scale(.7)}
  100%{opacity:1;transform:scale(1.1)}
}

.player-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.action-btn{
  background:rgba(255,255,255,.08);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:.8rem;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  transition:all .2s;
  white-space:nowrap;
}

.action-btn:hover{
  background:#e53e3e;
}

/* ===== PLAYER CONTAINER ===== */
.player-wrapper{
  position:relative;
  width:100%;
  height:calc(100vh - 62px);
  background:#000;
}

#jwplayer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

/* ===== QUALITY SELECTOR OVERLAY ===== */
.quality-panel{
  position:fixed;
  bottom:80px;
  right:20px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  min-width:180px;
  z-index:999;
  overflow:hidden;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:all .2s;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}

.quality-panel.active{
  opacity:1;
  transform:translateY(0);
  pointer-events:all;
}

.quality-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px 10px;
  border-bottom:1px solid #2a2a2a;
  font-weight:700;
  font-size:.9rem;
  color:#fff;
}

.quality-close{
  background:none;
  border:none;
  color:#999;
  cursor:pointer;
  font-size:1rem;
  padding:4px;
  border-radius:50%;
  transition:all .15s;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.quality-close:hover{
  background:#333;
  color:#fff;
}

.quality-list{
  padding:6px 0;
}

.quality-option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  cursor:pointer;
  font-size:.85rem;
  font-weight:500;
  color:#ccc;
  transition:all .12s;
  gap:12px;
}

.quality-option:hover{
  background:#252525;
  color:#fff;
}

.quality-option.active{
  font-weight:700;
  color:#fff;
  background:rgba(229,62,62,.15);
}

.quality-check{
  opacity:0;
  color:#e53e3e;
  font-size:.8rem;
}

.quality-option.active .quality-check{
  opacity:1;
}

/* ===== LOADING OVERLAY ===== */
.loading-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  z-index:50;
  transition:opacity .3s;
}

.loading-overlay.hidden{
  opacity:0;
  pointer-events:none;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid rgba(229,62,62,.2);
  border-top:4px solid #e53e3e;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loading-text{
  font-size:.9rem;
  opacity:.8;
}

/* ===== ERROR OVERLAY ===== */
.error-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  z-index:60;
  text-align:center;
  padding:24px;
}

.error-overlay.hidden{
  display:none;
}

.error-icon{
  font-size:3rem;
  color:#ef4444;
}

.error-title{
  font-size:1.1rem;
  font-weight:700;
}

.error-message{
  font-size:.85rem;
  opacity:.7;
  max-width:350px;
  line-height:1.5;
}

.error-buttons{
  display:flex;
  gap:10px;
  margin-top:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn{
  border:none;
  padding:10px 22px;
  border-radius:25px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:.85rem;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all .2s;
  text-decoration:none;
}

.btn:hover{
  transform:scale(1.03);
}

.btn-red{
  background:#ef4444;
}

.btn-blue{
  background:#3b82f6;
}

.btn-outline{
  background:transparent;
  border:1px solid #555;
}

.btn-outline:hover{
  border-color:#e53e3e;
  background:rgba(229,62,62,.1);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .top-bar{
    padding:8px 12px;
  }
  
  .player-wrapper{
    height:calc(100vh - 80px);
  }
  
  .channel-name{
    font-size:.82rem;
  }
  
  .action-btn span{
    display:none;
  }
  
  .quality-panel{
    right:10px;
    bottom:70px;
    min-width:160px;
  }
}

@media(max-width:480px){
  .top-bar{
    gap:6px;
  }
  
  .channel-info{
    order:3;
    width:100%;
  }
  
  .player-wrapper{
    height:calc(100vh - 110px);
  }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="index.html" class="back-btn">
    <i class="fas fa-arrow-left"></i> Back
  </a>
  
  <div class="channel-info">
    <img class="channel-logo" id="channelLogo" src="" alt="" onerror="this.style.display='none'">
    <div class="channel-details">
      <div class="channel-name" id="channelNameDisplay">Loading Stream...</div>
      <div class="channel-group" id="channelGroupDisplay"></div>
    </div>
  </div>
  
  <div class="player-actions">
    <button class="action-btn" id="qualityBtn">
      <i class="fas fa-cog"></i> <span>Quality</span>
    </button>
    <a class="action-btn" id="newTabBtn" href="#" target="_blank">
      <i class="fas fa-external-link-alt"></i> <span>New Tab</span>
    </a>
  </div>
  
  <div class="live-badge">
    <span class="live-dot"></span> LIVE
  </div>
</div>

<!-- PLAYER CONTAINER -->
<div class="player-wrapper" id="playerWrapper">
  <div id="jwplayer"></div>
  
  <!-- Quality Selector -->
  <div class="quality-panel" id="qualityPanel">
    <div class="quality-header">
      <span>Video Quality</span>
      <button class="quality-close" id="qualityClose">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="quality-list" id="qualityList">
      <div class="quality-option active" data-quality="auto">
        <span>Auto</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      </div>
      <div class="quality-option" data-quality="1080p">
        <span>1080p HD</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      </div>
      <div class="quality-option" data-quality="720p">
        <span>720p HD</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      </div>
      <div class="quality-option" data-quality="480p">
        <span>480p</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      </div>
      <div class="quality-option" data-quality="360p">
        <span>360p</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      </div>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span class="loading-text">Buffering stream...</span>
  </div>
  
  <!-- Error Overlay -->
  <div class="error-overlay hidden" id="errorOverlay">
    <div class="error-icon">
      <i class="fas fa-exclamation-circle"></i>
    </div>
    <div class="error-title">Stream Error</div>
    <div class="error-message" id="errorMessage">
      Unable to load the stream. Please try again.
    </div>
    <div class="error-buttons">
      <button class="btn btn-red" id="retryBtn">
        <i class="fas fa-redo-alt"></i> Retry
      </button>
      <button class="btn btn-blue" id="newTabBtn2">
        <i class="fas fa-external-link-alt"></i> Open in New Tab
      </button>
      <a href="index.html" class="btn btn-outline">
        <i class="fas fa-th-list"></i> Channel List
      </a>
    </div>
  </div>
</div>

<script>
// ===== GET URL PARAMETERS =====
const urlParams = new URLSearchParams(window.location.search);
const channelName = urlParams.get('name') || 'Live Stream';
const channelUrl = urlParams.get('url') || '';
const channelLogo = urlParams.get('logo') || '';
const channelGroup = urlParams.get('group') || '';

// ===== DOM ELEMENTS =====
const channelNameDisplay = document.getElementById('channelNameDisplay');
const channelGroupDisplay = document.getElementById('channelGroupDisplay');
const channelLogoImg = document.getElementById('channelLogo');
const loadingOverlay = document.getElementById('loadingOverlay');
const errorOverlay = document.getElementById('errorOverlay');
const errorMessage = document.getElementById('errorMessage');
const qualityPanel = document.getElementById('qualityPanel');
const qualityBtn = document.getElementById('qualityBtn');
const qualityClose = document.getElementById('qualityClose');
const newTabBtn = document.getElementById('newTabBtn');
const newTabBtn2 = document.getElementById('newTabBtn2');
const retryBtn = document.getElementById('retryBtn');

// ===== SET CHANNEL INFO =====
channelNameDisplay.textContent = channelName;
channelGroupDisplay.textContent = channelGroup;
if (channelLogo) {
  channelLogoImg.src = channelLogo;
}
newTabBtn.href = channelUrl;
newTabBtn2.onclick = () => window.open(channelUrl, '_blank');
retryBtn.onclick = () => initializePlayer();

// ===== JW PLAYER SETUP =====
let jwPlayerInstance = null;

function initializePlayer() {
  // Show loading
  loadingOverlay.classList.remove('hidden');
  errorOverlay.classList.add('hidden');
  
  if (!channelUrl) {
    showError('No stream URL provided. Please go back and select a channel.');
    return;
  }
  
  // Destroy existing player if any
  if (jwPlayerInstance) {
    jwPlayerInstance.remove();
    jwPlayerInstance = null;
  }
  
  // Determine stream type
  const isHLS = channelUrl.includes('.m3u8');
  const isDASH = channelUrl.includes('.mpd');
  
  // JW Player configuration
  const playerConfig = {
    file: channelUrl,
    width: '100%',
    height: '100%',
    autostart: true,
    mute: false,
    repeat: false,
    stretching: 'uniform',
    aspectratio: '16:9',
    
    // HLS Configuration
    hlshtml: true,
    
    // Quality labels
    qualityLabels: {
      2160: '4K',
      1440: '1440p',
      1080: '1080p HD',
      720: '720p HD',
      480: '480p',
      360: '360p',
      240: '240p'
    },
    
    // Captions
    captions: {
      color: '#ffffff',
      fontSize: 14,
      backgroundOpacity: 50
    },
    
    // Logo
    logo: {
      file: channelLogo || '',
      link: 'index.html',
      position: 'top-right',
      hide: true
    },
    
    // Skin
    skin: {
      name: 'glow',
      active: '#e53e3e',
      inactive: '#ffffff',
      background: '#000000'
    },
    
    // Casting
    cast: {},
    
    // Advertising (optional)
    advertising: {
      client: 'vast',
      skipmessage: 'Skip in {xx}',
      skiptext: 'Skip',
      skipoffset: 5
    }
  };
  
  // Setup JW Player
  try {
    jwPlayerInstance = jwplayer('jwplayer').setup(playerConfig);
    
    // Event Listeners
    
    // Ready event
    jwPlayerInstance.on('ready', function() {
      console.log('JW Player is ready');
      
      // Get available quality levels
      const levels = jwPlayerInstance.getQualityLevels();
      buildQualityMenu(levels);
    });
    
    // Play event
    jwPlayerInstance.on('play', function() {
      console.log('Stream started playing');
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.add('hidden');
    });
    
    // Buffer event
    jwPlayerInstance.on('buffer', function() {
      loadingOverlay.classList.remove('hidden');
    });
    
    // Buffer change event
    jwPlayerInstance.on('bufferChange', function(e) {
      if (e.bufferPercent >= 10) {
        loadingOverlay.classList.add('hidden');
      }
    });
    
    // Error event
    jwPlayerInstance.on('error', function(e) {
      console.error('JW Player Error:', e);
      let errorMsg = 'An error occurred while loading the stream.';
      
      if (e.code) {
        switch(e.code) {
          case 102:
          case 103:
          case 104:
            errorMsg = 'Unable to load the video. The stream may be offline or unavailable.';
            break;
          case 202:
          case 203:
            errorMsg = 'Stream format not supported. Please try opening in a new tab.';
            break;
          case 302:
            errorMsg = 'Network error. Please check your internet connection.';
            break;
          default:
            errorMsg = e.message || 'Unknown playback error. Please try again.';
        }
      }
      
      showError(errorMsg);
    });
    
    // Setup error event
    jwPlayerInstance.on('setupError', function(e) {
      console.error('JW Player Setup Error:', e);
      showError('Failed to initialize player. Please try again.');
    });
    
    // Quality change event
    jwPlayerInstance.on('levelsChanged', function(e) {
      const currentQuality = jwPlayerInstance.getCurrentQuality();
      updateQualitySelection(currentQuality);
    });
    
    // Fullscreen event
    jwPlayerInstance.on('fullscreen', function(e) {
      if (e.fullscreen) {
        qualityPanel.classList.remove('active');
      }
    });
    
  } catch(e) {
    console.error('JW Player initialization error:', e);
    showError('Could not initialize video player.');
  }
}

// ===== QUALITY MENU =====
function buildQualityMenu(levels) {
  const qualityList = document.getElementById('qualityList');
  qualityList.innerHTML = '';
  
  // Add Auto option
  const autoOption = document.createElement('div');
  autoOption.className = 'quality-option active';
  autoOption.dataset.index = '-1';
  autoOption.innerHTML = `
    <span>Auto (Best Quality)</span>
    <span class="quality-check"><i class="fas fa-check"></i></span>
  `;
  autoOption.addEventListener('click', function() {
    jwPlayerInstance.setCurrentQuality(-1);
    updateQualityUI(this);
    qualityPanel.classList.remove('active');
  });
  qualityList.appendChild(autoOption);
  
  // Add quality levels
  if (levels && levels.length > 0) {
    levels.forEach((level, index) => {
      const label = level.label || `${level.height || ''}p`;
      const height = level.height || '';
      
      const option = document.createElement('div');
      option.className = 'quality-option';
      option.dataset.index = index;
      option.innerHTML = `
        <span>${label}</span>
        <span class="quality-check"><i class="fas fa-check"></i></span>
      `;
      option.addEventListener('click', function() {
        jwPlayerInstance.setCurrentQuality(index);
        updateQualityUI(this);
        qualityPanel.classList.remove('active');
      });
      qualityList.appendChild(option);
    });
  }
}

function updateQualityUI(selectedElement) {
  const allOptions = document.querySelectorAll('.quality-option');
  allOptions.forEach(opt => opt.classList.remove('active'));
  selectedElement.classList.add('active');
}

function updateQualitySelection(index) {
  const allOptions = document.querySelectorAll('.quality-option');
  allOptions.forEach(opt => {
    const optIndex = parseInt(opt.dataset.index);
    opt.classList.toggle('active', optIndex === index);
  });
}

// ===== QUALITY PANEL TOGGLE =====
qualityBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  qualityPanel.classList.toggle('active');
});

qualityClose.addEventListener('click', function() {
  qualityPanel.classList.remove('active');
});

// Close panel when clicking outside
document.addEventListener('click', function(e) {
  if (!qualityPanel.contains(e.target) && e.target !== qualityBtn) {
    qualityPanel.classList.remove('active');
  }
});

// Close panel on escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    qualityPanel.classList.remove('active');
  }
  // 'F' key for fullscreen
  if (e.key === 'f' || e.key === 'F') {
    if (jwPlayerInstance) {
      const isFullscreen = jwPlayerInstance.getFullscreen();
      jwPlayerInstance.setFullscreen(!isFullscreen);
    }
  }
});

// ===== ERROR HANDLING =====
function showError(message) {
  loadingOverlay.classList.add('hidden');
  errorMessage.textContent = message || 'Stream could not be loaded.';
  errorOverlay.classList.remove('hidden');
}

function hideError() {
  errorOverlay.classList.add('hidden');
}

// ===== INITIALIZE =====
if (channelUrl) {
  initializePlayer();
  
  // Auto-hide loading after 10 seconds if stream doesn't start
  setTimeout(() => {
    if (!loadingOverlay.classList.contains('hidden')) {
      loadingOverlay.classList.add('hidden');
    }
  }, 10000);
} else {
  showError('No stream URL found. Please go back and select a channel.');
}

// ===== HANDLE PAGE UNLOAD =====
window.addEventListener('beforeunload', function() {
  if (jwPlayerInstance) {
    jwPlayerInstance.remove();
  }
});

// ===== SERVICE WORKER FOR OFFLINE =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Optional: Register service worker for caching
  });
}

console.log('JioTV+ Player initialized with JW Player');
console.log('Channel:', channelName);
console.log('Stream URL:', channelUrl);
</script>
</body>
</html>
