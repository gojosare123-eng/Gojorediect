<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>JioTV+ Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:15px;padding:10px 15px;
  background:#111;border-bottom:1px solid #222;
}
.back-btn{
  color:#fff;text-decoration:none;background:#333;padding:8px 15px;
  border-radius:20px;font-size:14px;display:flex;align-items:center;gap:5px;
}
.back-btn:hover{background:#e53e3e}
.ch-name{font-size:16px;font-weight:bold;flex:1}
.live-tag{background:#e53e3e;padding:5px 12px;border-radius:15px;font-size:12px;font-weight:bold}

.player-wrap{flex:1;position:relative;background:#000}
.player-wrap iframe{width:100%;height:100%;border:none}

.loading{
  position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:10;
}
.loading.hidden{display:none}
.spinner{
  width:40px;height:40px;border:3px solid #333;border-top:3px solid #e53e3e;
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error-msg{
  position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;
}
.error-msg.hidden{display:none}
.error-msg p{color:#ff6b6b;text-align:center;max-width:300px}
.btn{
  padding:10px 20px;border:none;border-radius:25px;color:#fff;cursor:pointer;
  font-size:14px;font-weight:bold;margin:5px;
}
.btn-red{background:#e53e3e}
.btn-blue{background:#3b82f6}

.debug-info{
  position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);
  padding:5px 10px;border-radius:10px;font-size:11px;z-index:5;
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn">← Back</a>
  <span class="ch-name" id="channelName">Loading...</span>
  <span class="live-tag">● LIVE</span>
</div>

<div class="player-wrap" id="playerWrap">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Loading stream...</span>
  </div>
  
  <div class="error-msg hidden" id="errorBox">
    <p id="errorText">Stream error</p>
    <div>
      <button class="btn btn-red" onclick="tryPlay()">Retry</button>
      <button class="btn btn-blue" onclick="openDirect()">Open Direct</button>
      <a href="index.html" class="btn" style="background:#444;text-decoration:none">Channels</a>
    </div>
  </div>
  
  <div class="debug-info" id="debugInfo">Ready</div>
</div>

<script>
// Get URL parameters
const urlParams = new URLSearchParams(window.location.search);
const chName = urlParams.get('name') || 'Live Stream';
const streamUrl = urlParams.get('url') || '';
const chId = urlParams.get('id') || '';
const cookie = urlParams.get('cookie') || '';

// DOM
document.getElementById('channelName').textContent = chName;
const playerWrap = document.getElementById('playerWrap');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('errorBox');
const errorText = document.getElementById('errorText');
const debugInfo = document.getElementById('debugInfo');

function log(msg) {
  console.log('[Player]', msg);
  debugInfo.textContent = msg;
}

function showError(msg) {
  loading.classList.add('hidden');
  errorText.textContent = msg;
  errorBox.classList.remove('hidden');
  log('ERROR: ' + msg);
}

function openDirect() {
  if (streamUrl) window.open(streamUrl, '_blank');
}

// Main play function
function tryPlay() {
  if (!streamUrl) {
    showError('No stream URL');
    return;
  }
  
  loading.classList.remove('hidden');
  errorBox.classList.add('hidden');
  log('Starting...');
  
  console.log('Channel:', chName);
  console.log('URL:', streamUrl);
  console.log('Cookie:', cookie ? 'Present' : 'None');
  
  // Clear previous
  playerWrap.querySelectorAll('iframe,video').forEach(el => el.remove());
  
  // Try method 1: Direct iframe with cookie via proxy approach
  tryMethod1();
}

// Method 1: Create HTML page that sets cookie then loads stream
function tryMethod1() {
  log('Method 1: Cookie injection...');
  
  const iframe = document.createElement('iframe');
  iframe.allow = 'autoplay; fullscreen';
  iframe.allowFullscreen = true;
  
  // Create a blob with HTML that sets cookie before loading
  const proxyHtml = `
    <!DOCTYPE html>
    <html>
    <head>
      <script src="https://cdn.dashjs.org/latest/dash.all.min.js"><\/script>
      <style>
        *{margin:0;padding:0;background:#000}
        video{width:100vw;height:100vh;object-fit:contain}
      <\/style>
    <\/head>
    <body>
      <video id="v" autoplay playsinline controls><\/video>
      <script>
        // Set cookie
        document.cookie = '${cookie.replace(/'/g, "\\'")};path=/;SameSite=None;Secure';
        
        // Initialize DASH player
        const player = dashjs.MediaPlayer().create();
        
        player.extend('RequestModifier', function() {
          return {
            modifyRequestHeader: function(xhr) {
              xhr.setRequestHeader('Cookie', '${cookie.replace(/'/g, "\\'")}');
              return xhr;
            }
          };
        });
        
        player.initialize(document.getElementById('v'), '${streamUrl}', true);
        
        player.on('playbackPlaying', function() {
          parent.postMessage('playing', '*');
        });
        
        player.on('error', function() {
          parent.postMessage('error', '*');
        });
      <\/script>
    <\/body>
    </html>
  `;
  
  const blob = new Blob([proxyHtml], {type: 'text/html'});
  iframe.src = URL.createObjectURL(blob);
  
  iframe.onload = function() {
    log('Player loaded');
    // Give it time to start
    setTimeout(function() {
      loading.classList.add('hidden');
    }, 5000);
  };
  
  playerWrap.appendChild(iframe);
  
  // Listen for messages from iframe
  window.addEventListener('message', function(e) {
    if (e.data === 'playing') {
      loading.classList.add('hidden');
      log('Playing');
    } else if (e.data === 'error') {
      // Try next method
      tryMethod2();
    }
  });
  
  // Timeout
  setTimeout(function() {
    if (!loading.classList.contains('hidden')) {
      log('Method 1 timeout, trying method 2...');
      tryMethod2();
    }
  }, 15000);
}

// Method 2: Direct video with DASH.js in main page
function tryMethod2() {
  log('Method 2: Direct DASH.js...');
  
  // Clear
  playerWrap.querySelectorAll('iframe').forEach(el => el.remove());
  
  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.controls = true;
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.objectFit = 'contain';
  playerWrap.appendChild(video);
  
  // Set cookie
  if (cookie) {
    document.cookie = cookie.split(';')[0] + ';path=/;SameSite=None;Secure';
  }
  
  // Check if dash.js is loaded
  if (typeof dashjs === 'undefined') {
    // Load dash.js dynamically
    const script = document.createElement('script');
    script.src = 'https://cdn.dashjs.org/latest/dash.all.min.js';
    script.onload = function() {
      initDashPlayer(video);
    };
    script.onerror = function() {
      tryMethod3();
    };
    document.head.appendChild(script);
  } else {
    initDashPlayer(video);
  }
}

function initDashPlayer(video) {
  try {
    const player = dashjs.MediaPlayer().create();
    
    if (cookie) {
      player.extend('RequestModifier', function() {
        return {
          modifyRequestHeader: function(xhr) {
            xhr.setRequestHeader('Cookie', cookie);
            return xhr;
          }
        };
      });
    }
    
    player.initialize(video, streamUrl, true);
    
    player.on('playbackPlaying', function() {
      loading.classList.add('hidden');
      log('▶ Playing via DASH.js');
    });
    
    player.on('error', function(e) {
      console.error('DASH error:', e);
      tryMethod3();
    });
    
    video.play().catch(function() {
      log('Click to start');
      loading.classList.add('hidden');
    });
    
  } catch(e) {
    console.error('DASH init error:', e);
    tryMethod3();
  }
  
  // Timeout
  setTimeout(function() {
    if (!loading.classList.contains('hidden')) {
      tryMethod3();
    }
  }, 12000);
}

// Method 3: Simple iframe
function tryMethod3() {
  log('Method 3: Simple iframe...');
  
  playerWrap.querySelectorAll('iframe,video').forEach(el => el.remove());
  
  const iframe = document.createElement('iframe');
  iframe.src = streamUrl;
  iframe.allow = 'autoplay; fullscreen';
  iframe.allowFullscreen = true;
  
  iframe.onload = function() {
    loading.classList.add('hidden');
    log('Iframe loaded');
  };
  
  iframe.onerror = function() {
    showError('All methods failed. Try opening directly.');
  };
  
  playerWrap.appendChild(iframe);
  
  setTimeout(function() {
    loading.classList.add('hidden');
  }, 8000);
}

// Start
if (streamUrl) {
  tryPlay();
} else {
  showError('No stream URL. Go back and select a channel.');
}

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') window.location.href = 'index.html';
});
</script>
</body>
</html>
